when:
  - event: cron
    cron: every-six-hours
    branch: main

# No event: manual here on purpose -- ci.yaml also matches event: manual and
# also builds+deploys arcade-adapter, so a generic manual pipeline trigger
# would run both workflows in parallel (multiple .woodpecker/*.yaml files
# share one pipeline, with no ordering by default), racing two builds
# against the same container. Confirmed live: this redeployed stale adapter
# code because the older-commit build happened to finish second.
# depends_on would fix the ordering, but its optional: true form (needed so
# the dependency isn't enforced on a cron-only run, where "ci" isn't part of
# the pipeline at all) requires Woodpecker v3.15+; this instance runs
# v3.12.0. Until that's upgraded, on-demand refresh goes through triggering
# the "every-six-hours" cron directly from the repo's Cron tab -- that only
# matches this file, so it never races ci.yaml at all.
#
# Pin to the Docker-backed agent -- see ci.yaml for why this matters.
labels:
  backend: docker

steps:
  - name: refresh
    image: docker:27-cli
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      SRCDS_TOKEN:
        from_secret: arcade_cs2_srcds_token
      CS2_RCONPW:
        from_secret: arcade_cs2_rcon_password
    commands:
      # "Regular checks and pulls that there's a new image" -- for both
      # halves. pull fetches whatever's current for joedwards32/cs2:latest;
      # --no-cache forces a fresh lib-arcade pull for the adapter. Each
      # `up -d <service>` is scoped individually and run separately --
      # confirmed live that a single unscoped `up -d` recreates every
      # service in the project together whenever any one of them
      # changes, which would restart a live game for no reason on every
      # adapter rebuild even when cs2 itself never changed.
      - docker compose -p arcade-cs2 pull cs2
      - docker compose -p arcade-cs2 up -d cs2
      - docker compose -p arcade-cs2 build --no-cache arcade-adapter
      - docker compose -p arcade-cs2 up -d arcade-adapter
