when:
  - event: cron
    cron: every-six-hours
    branch: main
  - event: manual
    branch: main

# ci.yaml also matches event: manual and also builds+deploys arcade-adapter --
# without this, a manual trigger runs both workflows in parallel (multiple
# .woodpecker/*.yaml files share one pipeline, with no ordering by default),
# racing two builds against the same container. Confirmed live: a manual
# trigger redeployed stale adapter code because the older-commit build
# happened to finish second. optional: true because "ci" isn't part of the
# pipeline at all for a cron-triggered run (ci.yaml has no event: cron).
# Requires Woodpecker v3.15+ for the optional flag to parse at all --
# confirmed this instance is now on v3.18.0.
depends_on:
  - name: ci
    optional: true

# Pin to the Docker-backed agent -- see ci.yaml for why this matters.
labels:
  backend: docker

steps:
  - name: refresh
    image: docker:27-cli
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      SRCDS_TOKEN:
        from_secret: arcade_cs2_srcds_token
      CS2_RCONPW:
        from_secret: arcade_cs2_rcon_password
    commands:
      # "Regular checks and pulls that there's a new image" -- for both
      # halves. pull fetches whatever's current for joedwards32/cs2:latest;
      # --no-cache forces a fresh lib-arcade pull for the adapter. Each
      # `up -d <service>` is scoped individually and run separately --
      # confirmed live that a single unscoped `up -d` recreates every
      # service in the project together whenever any one of them
      # changes, which would restart a live game for no reason on every
      # adapter rebuild even when cs2 itself never changed.
      #
      # cs2 only gets recreated (up -d) when both of these hold:
      #   - the pull actually changed the local joedwards32/cs2:latest
      #     image (compared by image ID, not just "pull ran" -- pull is a
      #     no-op most cycles since the upstream image rarely moves)
      #   - it was already running beforehand
      # Pulling itself is always safe to run unconditionally, even while
      # stopped -- it only refreshes the local image cache and never
      # touches the container. Recreating is not: an unconditional
      # `up -d cs2` would silently undo a deliberate stop via the arcade
      # portal's stop action the next time this cron fires (or the next
      # manual trigger) -- `restart: unless-stopped` in docker-compose.yml
      # only protects against a Docker daemon/host restart, not against
      # this job's own `up -d`. `ps -q` lists only currently-running
      # containers for the service, so an empty result means it's
      # intentionally down.
      - |
        OLD_IMAGE_ID="$(docker image inspect joedwards32/cs2:latest --format '{{.Id}}' 2>/dev/null || true)"
        docker compose -p arcade-cs2 pull cs2
        NEW_IMAGE_ID="$(docker image inspect joedwards32/cs2:latest --format '{{.Id}}' 2>/dev/null || true)"
        WAS_RUNNING="$(docker compose -p arcade-cs2 ps -q cs2)"
        if [ -z "$WAS_RUNNING" ]; then
          echo "cs2 is currently stopped -- leaving it stopped (pulled latest image for next start)"
        elif [ "$OLD_IMAGE_ID" != "$NEW_IMAGE_ID" ]; then
          docker compose -p arcade-cs2 up -d cs2
        else
          echo "cs2 image already up to date -- no restart needed"
        fi
      - docker compose -p arcade-cs2 build --no-cache arcade-adapter
      - docker compose -p arcade-cs2 up -d arcade-adapter
