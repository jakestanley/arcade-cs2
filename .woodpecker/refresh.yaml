when:
  - event: cron
    cron: every-six-hours
    branch: main

steps:
  - name: refresh
    image: docker:27-cli
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      SRCDS_TOKEN:
        from_secret: arcade_cs2_srcds_token
      CS2_RCONPW:
        from_secret: arcade_cs2_rcon_password
    commands:
      # "Regular checks and pulls that there's a new image" -- for both
      # halves. pull fetches whatever's current for joedwards32/cs2:latest;
      # --no-cache forces a fresh lib-arcade pull for the adapter. Either
      # way, `up -d` only actually recreates a service if what it
      # resolved differs from what's running -- no manual digest
      # comparison needed, Compose already does that check.
      - docker compose -p arcade-cs2 pull cs2
      - docker compose -p arcade-cs2 build --no-cache arcade-adapter
      - docker compose -p arcade-cs2 up -d
