when:
  - event: cron
    cron: every-six-hours
    branch: main
  - event: manual
    branch: main

# ci.yaml also matches event: manual and also builds+deploys arcade-adapter --
# without this, a manual trigger runs both workflows in parallel (multiple
# .woodpecker/*.yaml files share one pipeline, with no ordering by default),
# racing two builds against the same container. Confirmed live: a manual
# trigger redeployed stale adapter code because the older-commit build
# happened to finish second. optional: true because "ci" isn't part of the
# pipeline at all for a cron-triggered run (ci.yaml has no event: cron).
# Requires Woodpecker v3.15+ for the optional flag to parse at all --
# confirmed this instance is now on v3.18.0.
depends_on:
  - name: ci
    optional: true

# Pin to the Docker-backed agent -- see ci.yaml for why this matters.
labels:
  backend: docker

steps:
  - name: refresh
    image: docker:27-cli
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      SRCDS_TOKEN:
        from_secret: arcade_cs2_srcds_token
      CS2_RCONPW:
        from_secret: arcade_cs2_rcon_password
    commands:
      # This job no longer touches cs2 at all -- checking for and applying
      # a new joedwards32/cs2 image is now owned entirely by lib-arcade's
      # own update_available/update baseline action (see arcade/README.md
      # and lib-arcade's server.py), triggered by a human from the arcade
      # portal so a bad update is caught immediately by whoever clicked
      # it, rather than silently landing via an unattended CI cron. This
      # step's only remaining job is keeping arcade-adapter itself current
      # with lib-arcade -- --no-cache forces a fresh pip install since
      # requirements.txt pins lib-arcade @main, so its own content (and
      # therefore Docker's cache key) never changes on its own. Scoped to
      # just arcade-adapter, not a project-wide `up -d`, so this never
      # touches cs2's container.
      - docker compose -p arcade-cs2 build --no-cache arcade-adapter
      - docker compose -p arcade-cs2 up -d arcade-adapter
